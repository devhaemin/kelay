# Local LLM gateway on top of the root stack. Run from the repo root:
#   docker compose -f docker-compose.yml -f infra/local/compose.services.yml up -d litellm
# Paths are relative to the repo root, because Compose resolves every -f file against the first one.
# Provider keys come from the repo-root .env (ANTHROPIC_API_KEY, optionally OPENAI_API_KEY, GEMINI_API_KEY).
services:
  litellm-db-init:
    image: postgres:17
    depends_on: [postgres]
    environment:
      PGHOST: postgres
      PGUSER: kelay
      PGPASSWORD: kelay
      PGDATABASE: kelay_control
    entrypoint: ["sh", "-c"]
    command:
      - |
        until pg_isready -q; do sleep 1; done
        psql -tAc "SELECT 1 FROM pg_database WHERE datname = 'litellm'" | grep -q 1 || psql -c "CREATE DATABASE litellm"
    restart: "no"

  litellm:
    image: ghcr.io/berriai/litellm:v1.106.6
    depends_on:
      litellm-db-init:
        condition: service_completed_successfully
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports: ["4000:4000"]
    environment:
      # The master key doubles as the local gateway key (LLM_GATEWAY_KEY in .env.example).
      LITELLM_MASTER_KEY: ${LLM_GATEWAY_KEY:-sk-kelay-dev}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:-sk-kelay-dev-salt-not-for-prod}
      DATABASE_URL: postgres://kelay:kelay@postgres:5432/litellm
      STORE_MODEL_IN_DB: "False"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # No collector locally; spans print to the container log.
      OTEL_EXPORTER: console
    volumes:
      - ./infra/litellm/config.yaml:/app/config.yaml:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

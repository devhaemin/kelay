# Local Postgres for the whole stack. `pnpm dev:up` starts it, migrates, seeds and runs every service
# (see README "Run locally"); `pnpm db:up` starts Postgres only.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: kelay
      POSTGRES_PASSWORD: kelay
      POSTGRES_DB: kelay_control
    ports: ["54320:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kelay -d kelay_control"]
      interval: 1s
      timeout: 3s
      retries: 30
    volumes:
      - ./infra/local/init-db.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata: {}

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kelay · live access rules</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbfaf7;--surface:#fff;--s2:#f5f4f0;--border:#e7e5df;--text:#1b1b1a;--muted:#6f6d67;--accent:#4f6bff;--accent-soft:#eef1ff;--red:#d64545;--red-soft:#fdecec;--green:#1f9d55;--green-soft:#e6f6ec}
*{box-sizing:border-box}body{margin:0;font-family:Geist,system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
main{max-width:1120px;margin:0 auto;padding:28px 24px 64px}h1{font-size:26px;letter-spacing:-.02em;margin:0 0 6px}p{color:var(--muted);margin:0 0 20px;max-width:70ch;line-height:1.5}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.seg{display:inline-flex;background:var(--s2);border-radius:10px;padding:3px}.seg button{font:inherit;border:0;background:none;height:32px;padding:0 14px;border-radius:8px;color:var(--muted);font-weight:500;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pill{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:500;background:var(--accent-soft);color:var(--accent)}
.board{display:grid;grid-template-columns:repeat(4,minmax(200px,1fr));gap:12px;overflow-x:auto}
.col{background:var(--s2);border-radius:12px;padding:10px;min-height:160px}.col h2{font-size:13px;margin:4px 6px 10px}
.t{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.t b{display:block;font-weight:500;line-height:1.4}.t small{color:var(--muted);display:block;margin:4px 0 8px}
.t .mv{display:flex;gap:4px;flex-wrap:wrap}.t .mv button{font:inherit;font-size:12px;border:1px solid var(--border);background:var(--surface);border-radius:7px;height:26px;padding:0 8px;cursor:pointer}
.t .mv button:hover{background:var(--s2)}
.log{margin-top:16px;border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:12px 16px;font-family:"Geist Mono",ui-monospace,monospace;font-size:12px;line-height:1.7;max-height:190px;overflow:auto}
.log .no{color:var(--red)}.log .ok{color:var(--green)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none}.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style></head><body><main>
<h1>Access rules, enforced by the database</h1>
<p>Each request carries a signed Kelay ID token. The server sets the token's claims on the transaction and Postgres row-level security decides the rest. The app code has no permission checks.</p>
<div class="bar"><span>View as</span><div class="seg" id="people"></div><span class="pill" id="count"></span></div>
<div class="board" id="board"></div>
<div class="log" id="log" aria-live="polite"></div>
</main><div class="toast" id="toast" role="status"></div>
<script>
const COLS=[['todo','To do'],['doing','In progress'],['review','Review'],['done','Done']];
let me='junho',token='',people={};
const $=id=>document.getElementById(id);
const log=(cls,msg)=>{const d=document.createElement('div');d.className=cls;d.textContent=msg;$('log').prepend(d)};
const toast=m=>{const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2400)};
async function load(){
  const r=await fetch('/api/tickets',{headers:{authorization:'Bearer '+token}});const {rows,total}=await r.json();
  $('count').textContent=`${people[me].name} · ${people[me].role} sees ${rows.length} of ${total} tickets`;
  log('ok',`SELECT * FROM app.tickets  →  ${rows.length} rows  (role=${people[me].role}, uid=${me})`);
  $('board').innerHTML=COLS.map(([k,l])=>`<section class="col"><h2>${l}</h2>${rows.filter(t=>t.status===k).map(t=>`<div class="t"><b>${t.title}</b><small>${t.shared?'Shared · ':''}${t.assignee_id}</small><div class="mv">${COLS.filter(c=>c[0]!==k).map(c=>`<button data-id="${t.id}" data-s="${c[0]}" aria-label="Move ${t.title} to ${c[1]}">→ ${c[1]}</button>`).join('')}</div></div>`).join('')}</section>`).join('');
  document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>move(b.dataset.id,b.dataset.s));
}
async function move(id,status){
  const r=await fetch('/api/move',{method:'POST',headers:{authorization:'Bearer '+token,'content-type':'application/json'},body:JSON.stringify({id,status})});
  const j=await r.json();
  if(!r.ok){log('no',`UPDATE app.tickets SET status='${status}'  →  denied by RLS (${j.error.message})`);toast(j.error.message);return}
  log('ok',`UPDATE app.tickets SET status='${status}'  →  1 row`);load();
}
async function pick(id){me=id;token=(await (await fetch('/api/token?as='+id)).json()).token;
  $('people').innerHTML=Object.entries(people).map(([k,p])=>`<button aria-pressed="${k===me}" data-p="${k}">${p.name} · ${p.role}</button>`).join('');
  document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>pick(b.dataset.p));load()}
(async()=>{people=await (await fetch('/api/people')).json();pick('junho')})();
</script></body></html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Keley — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #fbfaf7;
    --surface: #ffffff;
    --surface-2: #f5f4f0;
    --border: #e7e5df;
    --text: #1b1b1a;
    --muted: #6f6d67;
    --faint: #a3a19a;
    --accent: #4f6bff;
    --accent-soft: #eef1ff;
    --green: #1f9d55;
    --green-soft: #e6f6ec;
    --amber: #b7791f;
    --amber-soft: #fdf3e1;
    --red: #d64545;
    --red-soft: #fdecec;
    --violet: #8b5cf6;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: Inter, system-ui, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input, textarea, select { font: inherit; color: inherit; }
  .icon { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* ---------- Global top bar ---------- */
  .topbar { height: 56px; display: flex; align-items: center; gap: 24px; padding: 0 24px; position: relative; z-index: 5; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; }
  .brand-mark { width: 24px; height: 24px; border-radius: 7px; background: conic-gradient(from 200deg, #4f6bff, #b46cff, #ff6fb1, #4f6bff); }
  .topnav { display: flex; gap: 4px; }
  .topnav a { padding: 6px 12px; border-radius: 8px; color: var(--muted); font-weight: 500; }
  .topnav a.active, .topnav a:hover { color: var(--text); background: rgba(0,0,0,.05); }
  .topbar .spacer { flex: 1; }
  .avatar { width: 30px; height: 30px; border-radius: 50%; background: #2d2d2b; color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 600; }

  .btn { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); font-weight: 500; white-space: nowrap; }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--text); color: #fff; border-color: var(--text); }
  .btn.primary:hover { background: #333; }
  .btn.accent { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.ghost { border-color: transparent; background: transparent; }
  .btn.sm { height: 28px; padding: 0 10px; font-size: 13px; border-radius: 8px; }

  .pill { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 12px; font-weight: 500; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
  .pill.green { background: var(--green-soft); color: var(--green); }
  .pill.amber { background: var(--amber-soft); color: var(--amber); }
  .pill.red { background: var(--red-soft); color: var(--red); }
  .pill.blue { background: var(--accent-soft); color: var(--accent); }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  /* ---------- 1. Home ---------- */
  .home { min-height: 100vh; position: relative; overflow: hidden; }
  .home::before { content: ""; position: absolute; inset: 0; z-index: 0;
    background:
      radial-gradient(60% 45% at 50% 62%, rgba(180,200,255,.85), transparent 70%),
      radial-gradient(70% 55% at 0% 70%, #6b8cff 0%, transparent 60%),
      radial-gradient(70% 55% at 100% 70%, #6b8cff 0%, transparent 60%),
      radial-gradient(80% 50% at 10% 100%, #f08bdc 0%, transparent 60%),
      radial-gradient(80% 50% at 90% 100%, #f08bdc 0%, transparent 60%),
      linear-gradient(180deg, var(--bg) 25%, #c9d3ff 60%, #ef9ad8 100%);
  }
  .hero { position: relative; z-index: 1; max-width: 760px; margin: 0 auto; padding: 18vh 24px 48px; text-align: center; }
  .hero h1 { font-size: clamp(36px, 6vw, 64px); letter-spacing: -0.04em; margin: 0 0 12px; font-weight: 800; }
  .hero p { color: #55534d; font-size: 18px; margin: 0 0 40px; }
  .prompt { background: var(--surface); border-radius: 28px; box-shadow: 0 20px 60px rgba(60,60,140,.25); padding: 18px 18px 12px; text-align: left; }
  .prompt textarea { width: 100%; border: none; outline: none; resize: none; font-size: 16px; min-height: 52px; padding: 4px 6px; background: transparent; }
  .prompt-row { display: flex; align-items: center; gap: 8px; }
  .round { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border); display: grid; place-items: center; color: var(--muted); }
  .send { width: 36px; height: 36px; border-radius: 50%; background: var(--text); color: #fff; display: grid; place-items: center; }
  .send:disabled { background: #cfcdc6; cursor: default; }
  .suggestions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 20px; }
  .suggestions button { background: rgba(255,255,255,.7); backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,.9); padding: 7px 14px; border-radius: 999px; font-size: 13px; color: #3a3935; }
  .suggestions button:hover { background: #fff; }
  .home-recent { position: relative; z-index: 1; max-width: 1080px; margin: 0 auto; padding: 0 24px 64px; }
  .home-recent-card { background: rgba(255,255,255,.85); backdrop-filter: blur(10px); border-radius: 20px; padding: 20px; }
  .section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .section-head h2 { font-size: 16px; margin: 0; }

  /* ---------- 2. My Apps ---------- */
  .page { max-width: 1160px; margin: 0 auto; padding: 24px; }
  .page-title { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin: 16px 0 24px; flex-wrap: wrap; }
  .page-title h1 { font-size: 28px; margin: 0 0 4px; letter-spacing: -0.02em; }
  .page-title p { margin: 0; color: var(--muted); }
  .profile { display: flex; align-items: center; gap: 16px; }
  .profile .avatar { width: 56px; height: 56px; font-size: 20px; }
  .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 18px; flex-wrap: wrap; }
  .search { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--muted); min-width: 240px; }
  .search input { border: none; outline: none; background: transparent; flex: 1; }
  .seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; }
  .seg button { height: 28px; padding: 0 12px; border-radius: 8px; color: var(--muted); font-weight: 500; font-size: 13px; }
  .seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .app-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; transition: transform .15s, box-shadow .15s; display: flex; flex-direction: column; }
  .app-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
  .app-thumb { height: 140px; position: relative; display: grid; place-items: center; }
  .app-thumb .mini { width: 70%; height: 78%; background: rgba(255,255,255,.92); border-radius: 10px 10px 0 0; align-self: end; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
  .mini i { display: block; height: 6px; border-radius: 3px; background: #e6e4de; }
  .app-body { padding: 14px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .app-row { display: flex; align-items: center; gap: 10px; }
  .app-icon { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-size: 18px; flex: none; }
  .app-name { font-weight: 600; }
  .app-desc { color: var(--muted); font-size: 13px; line-height: 1.45; }
  .app-meta { display: flex; gap: 12px; color: var(--muted); font-size: 12px; margin-top: auto; padding-top: 10px; border-top: 1px solid var(--border); }
  .app-meta span { display: inline-flex; align-items: center; gap: 4px; }
  .new-card { border: 1.5px dashed #d6d3cb; border-radius: var(--radius); display: grid; place-items: center; min-height: 280px; color: var(--muted); text-align: center; gap: 8px; }
  .new-card:hover { background: var(--surface); color: var(--text); }
  .new-card .round { margin: 0 auto 8px; width: 44px; height: 44px; }

  /* ---------- 3. Workspace ---------- */
  .ws { display: grid; grid-template-columns: 1fr 400px; height: 100vh; }
  .ws.chat-collapsed { grid-template-columns: 1fr 0; }
  .ws-main { display: flex; flex-direction: column; min-width: 0; border-right: 1px solid var(--border); }
  .ws-head { display: flex; align-items: center; gap: 12px; padding: 12px 20px; }
  .ws-head .back { color: var(--muted); display: grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; }
  .ws-head .back:hover { background: var(--surface-2); color: var(--text); }
  .ws-title { font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 8px; }
  .tabs { display: flex; gap: 4px; padding: 0 16px; border-bottom: 1px solid var(--border); }
  .tabs a { display: inline-flex; align-items: center; gap: 7px; padding: 12px 10px; color: var(--muted); font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tabs a:hover { color: var(--text); }
  .tabs a.on { color: var(--text); border-bottom-color: var(--text); }
  .tabs .count { background: var(--accent); color: #fff; font-size: 11px; padding: 0 6px; border-radius: 999px; line-height: 17px; }
  .ws-body { flex: 1; overflow: auto; padding: 20px; background: var(--bg); }
  .banner { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; margin-bottom: 16px; }
  .banner b { font-weight: 600; }
  .banner .spacer { flex: 1; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
  .card-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .card-head h3 { margin: 0; font-size: 14px; font-weight: 600; }
  .card-head .spacer { flex: 1; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }

  /* Screen tab */
  .preview-wrap { display: flex; flex-direction: column; height: 100%; }
  .preview-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .url { flex: 1; display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--border); color: var(--muted); font-size: 13px; }
  .stage { flex: 1; display: grid; place-items: start center; overflow: auto; background: repeating-conic-gradient(#f2f1ec 0% 25%, transparent 0% 50%) 0 0 / 16px 16px; border-radius: var(--radius); border: 1px solid var(--border); padding: 24px; }
  .device { background: #fff; border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; width: 100%; max-width: 980px; transition: max-width .25s; }
  .device.mobile { max-width: 380px; border-radius: 28px; border: 8px solid #1b1b1a; }
  .mock-nav { display: flex; align-items: center; gap: 16px; padding: 14px 20px; border-bottom: 1px solid #eee; font-size: 13px; }
  .mock-hero { padding: 36px 24px; background: linear-gradient(135deg, #fff4e6, #ffe3ef); }
  .mock-hero h2 { margin: 0 0 8px; font-size: 26px; letter-spacing: -0.02em; }
  .mock-hero p { margin: 0 0 18px; color: #6b5f57; }
  .mock-input { display: flex; gap: 8px; background: #fff; border-radius: 12px; padding: 6px; box-shadow: 0 4px 14px rgba(0,0,0,.06); max-width: 520px; }
  .mock-input div { flex: 1; padding: 8px 10px; color: #aaa; font-size: 13px; }
  .mock-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; padding: 20px 24px 28px; }
  .mock-item { border-radius: 10px; background: #f6f5f1; height: 150px; display: flex; flex-direction: column; justify-content: end; padding: 10px; font-size: 12px; color: #555; position: relative; outline: 2px solid transparent; outline-offset: 2px; }
  .mock-item.selected { outline-color: var(--accent); }
  .mock-item .tag { position: absolute; top: -10px; left: 8px; background: var(--accent); color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 4px; }

  /* Monitoring */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .kpi .label { color: var(--muted); font-size: 12px; }
  .kpi .val { font-size: 22px; font-weight: 700; margin: 6px 0 2px; letter-spacing: -0.02em; }
  .kpi .delta { font-size: 12px; }
  .up { color: var(--green); } .down { color: var(--red); }
  .two { display: grid; grid-template-columns: 1.5fr 1fr; gap: 16px; margin-bottom: 16px; }
  .graph-canvas { position: relative; height: 340px; background: radial-gradient(circle, #e4e2db 1px, transparent 1px) 0 0 / 18px 18px; border-radius: 0 0 var(--radius) var(--radius); overflow: hidden; }
  .graph-canvas svg.edges { position: absolute; inset: 0; width: 100%; height: 100%; }
  .gnode { position: absolute; transform: translate(-50%, -50%); background: var(--surface); border: 1.5px solid var(--border); border-radius: 12px; padding: 8px 12px; min-width: 120px; box-shadow: 0 2px 8px rgba(0,0,0,.05); cursor: pointer; font-size: 12px; }
  .gnode:hover, .gnode.sel { border-color: var(--accent); }
  .gnode .t { font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 6px; }
  .gnode .s { color: var(--muted); margin-top: 2px; }
  .gnode.warn { border-color: #f0c27a; }
  .gnode.err { border-color: #f0a3a3; }
  .node-detail { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .kv { display: grid; grid-template-columns: 110px 1fr; gap: 8px 12px; font-size: 13px; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 16px; border-bottom: 1px solid var(--border); font-size: 13px; white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; background: var(--surface-2); }
  tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: #fcfbf8; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--muted); }

  /* Users */
  .users-layout { display: grid; grid-template-columns: 200px 1fr; gap: 16px; }
  .side-list { display: flex; flex-direction: column; gap: 2px; }
  .side-list .label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); padding: 10px 10px 6px; }
  .side-list a { padding: 7px 10px; border-radius: 8px; color: var(--muted); display: flex; justify-content: space-between; }
  .side-list a.on, .side-list a:hover { background: var(--surface); color: var(--text); }
  .table-wrap { overflow: auto; }
  .cb { width: 14px; height: 14px; border: 1.5px solid #cfcdc6; border-radius: 4px; display: inline-block; vertical-align: middle; }
  .prov { display: inline-flex; align-items: center; gap: 6px; }
  .prov i { width: 16px; height: 16px; border-radius: 4px; display: grid; place-items: center; font-style: normal; font-size: 10px; font-weight: 700; color: #fff; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 380px; background: var(--surface); border-left: 1px solid var(--border); box-shadow: -20px 0 40px rgba(0,0,0,.08); z-index: 30; transform: translateX(100%); transition: transform .2s; display: flex; flex-direction: column; }
  .drawer.open { transform: none; }
  .drawer-body { padding: 20px; overflow: auto; flex: 1; display: flex; flex-direction: column; gap: 18px; }
  .drawer h4 { margin: 0 0 8px; font-size: 12px; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: .05em; }

  /* Feedback */
  .report { border: 1px solid #d9defd; background: linear-gradient(180deg, #f6f7ff, #fff 120px); border-radius: var(--radius); margin-bottom: 20px; }
  .report-head { display: flex; align-items: center; gap: 12px; padding: 16px 18px; }
  .agent-badge { width: 36px; height: 36px; border-radius: 10px; background: conic-gradient(from 200deg, #4f6bff, #b46cff, #ff6fb1, #4f6bff); display: grid; place-items: center; color: #fff; }
  .report-summary { padding: 0 18px 14px; color: #3c3b37; line-height: 1.55; }
  .proposal { border-top: 1px solid #e3e6fb; padding: 16px 18px; display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; align-items: start; }
  .proposal .num { width: 24px; height: 24px; border-radius: 7px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 700; font-size: 12px; }
  .proposal h4 { margin: 0 0 4px; font-size: 14px; }
  .proposal p { margin: 0 0 8px; color: var(--muted); line-height: 1.5; }
  .proposal .refs { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .ticket-ref { font-family: ui-monospace, Menlo, monospace; font-size: 11px; padding: 2px 6px; border-radius: 5px; background: var(--surface-2); color: var(--muted); cursor: pointer; }
  .ticket-ref:hover { color: var(--accent); }
  .proposal-actions { display: flex; gap: 6px; }
  .proposal.approved { background: #f5fbf7; }
  .proposal.rejected { opacity: .5; }
  .report-foot { border-top: 1px solid #e3e6fb; padding: 12px 18px; display: flex; align-items: center; gap: 10px; }
  .report-foot .spacer { flex: 1; }
  .board { display: grid; grid-template-columns: repeat(4, minmax(220px, 1fr)); gap: 12px; overflow-x: auto; }
  .col { background: var(--surface-2); border-radius: 12px; padding: 10px; min-height: 200px; }
  .col-head { display: flex; align-items: center; gap: 8px; padding: 4px 6px 10px; font-weight: 600; font-size: 13px; }
  .col-head .n { color: var(--muted); font-weight: 500; }
  .ticket { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; display: flex; flex-direction: column; gap: 8px; cursor: pointer; }
  .ticket:hover { border-color: #cfcdc6; }
  .ticket.hl { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .ticket .title { font-weight: 500; line-height: 1.4; }
  .ticket .quote { color: var(--muted); font-size: 12px; line-height: 1.45; border-left: 2px solid var(--border); padding-left: 8px; }
  .ticket .foot { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .ticket .foot .spacer { flex: 1; }
  .prio { width: 14px; height: 14px; display: inline-grid; place-items: center; }
  .type-tag { font-size: 11px; padding: 1px 6px; border-radius: 4px; font-weight: 500; }
  .type-bug { background: var(--red-soft); color: var(--red); }
  .type-ux { background: var(--accent-soft); color: var(--accent); }
  .type-feat { background: #f1eafe; color: var(--violet); }
  .type-quality { background: var(--amber-soft); color: var(--amber); }

  /* Chat panel */
  .chat { display: flex; flex-direction: column; min-width: 0; overflow: hidden; background: var(--surface); }
  .chat-head { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .chat-head .spacer { flex: 1; }
  .chat-sub { display: flex; align-items: center; gap: 6px; padding: 8px 16px; color: var(--muted); font-size: 12px; border-bottom: 1px solid var(--border); }
  .msgs { flex: 1; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .msg { line-height: 1.55; }
  .msg.user { align-self: flex-end; background: var(--surface-2); padding: 10px 14px; border-radius: 14px 14px 4px 14px; max-width: 85%; }
  .msg.agent { display: flex; flex-direction: column; gap: 8px; }
  .msg .who { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); font-weight: 500; }
  .step { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); padding: 6px 10px; border: 1px solid var(--border); border-radius: 8px; }
  .step.done .icon { color: var(--green); }
  .spinner { width: 12px; height: 12px; border: 2px solid #d6d3cb; border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .composer { margin: 12px; border: 1px solid var(--border); border-radius: 16px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .context-chip { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 4px 8px; border-radius: 8px; background: var(--surface-2); color: var(--muted); }
  .composer textarea { border: none; outline: none; resize: none; min-height: 44px; padding: 4px; }
  .composer-row { display: flex; align-items: center; gap: 6px; }
  .composer-row .spacer { flex: 1; }
  .model { font-size: 12px; color: var(--muted); padding: 4px 8px; border-radius: 8px; background: var(--surface-2); }

  /* Toast */
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translate(-50%, 20px); background: var(--text); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 13px; opacity: 0; transition: .2s; z-index: 50; pointer-events: none; display: flex; align-items: center; gap: 8px; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* Proto nav (design review helper) */

/* --- Monitoring tab --- */
function lineChart() {
  const runs = [380, 410, 395, 450, 520, 480, 460, 530, 590, 560, 610, 640, 600, 612];
  const errs = [6, 5, 8, 7, 9, 12, 10, 14, 22, 25, 28, 26, 30, 28];
  const W = 640, H = 200, P = 28, max = 700;
  const x = i => P + i * (W - P * 2) / (runs.length - 1);
  const y = v => H - P - v / max * (H - P * 2);
  const path = arr => arr.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
  const grid = [0, 200, 400, 600].map(v => `<line x1="${P}" x2="${W - P}" y1="${y(v)}" y2="${y(v)}" stroke="#eeece6"/><text x="${P - 6}" y="${y(v) + 4}" font-size="10" fill="#a3a19a" text-anchor="end">${v}</text>`).join('');
  const label = i => { const d = new Date(2026, 9, 29 + i); return d.toLocaleString('en', { month: 'short', day: 'numeric' }); };
  const days = runs.map((_, i) => i % 3 === 1 ? `<text x="${x(i)}" y="${H - 8}" font-size="10" fill="#a3a19a" text-anchor="middle">${label(i)}</text>` : '').join('');
  return `
  <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
    ${grid}${days}
    <path d="${path(runs)} L${x(runs.length - 1)},${y(0)} L${x(0)},${y(0)}Z" fill="#4f6bff" opacity=".07"/>
    <path d="${path(runs)}" fill="none" stroke="#4f6bff" stroke-width="2"/>
    <path d="${path(errs)}" fill="none" stroke="#d64545" stroke-width="2" stroke-dasharray="4 3"/>
    <circle cx="${x(13)}" cy="${y(612)}" r="4" fill="#4f6bff"/>
  </svg>`;
}
function agentGraph() {
  const N = Object.fromEntries(GRAPH.nodes.map(n => [n.id, n]));
  const edges = GRAPH.edges.map(([a, b, c]) => {
    const A = N[a], B = N[b];
    if (a === 'review' && b === 'plan') {
      return `<path d="M${A.x},${A.y + 8} C${A.x},96 ${B.x},96 ${B.x},${B.y + 8}" fill="none" stroke="#f0c27a" stroke-width=".35" stroke-dasharray="1 .8" vector-effect="non-scaling-stroke" style="stroke-width:1.5px"/>
        <text x="${(A.x + B.x) / 2}" y="90" font-size="3" fill="#b7791f" text-anchor="middle">retry · ${c}</text>`;
    }
    const w = Math.max(1.5, c / 200);
    return `<line x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}" stroke="${b === 'design' || a === 'design' ? '#f0c27a' : '#c9cff8'}" vector-effect="non-scaling-stroke" style="stroke-width:${w}px"/>`;
  }).join('');
  const nodes = GRAPH.nodes.map(n => `
    <div class="gnode ${n.state || ''} ${state.selectedNode === n.id ? 'sel' : ''}" data-node="${n.id}" style="left:${n.x}%;top:${n.y}%">
      <div class="t">${ic(n.icon, 13)} ${n.t} ${n.err > 2 ? '<span class="pill amber" style="height:18px;font-size:10px">'+n.err+'% err</span>' : ''}</div>
      <div class="s">${n.s}</div>
    </div>`).join('');
  return `<div class="graph-canvas"><svg class="edges" viewBox="0 0 100 100" preserveAspectRatio="none">${edges}</svg>${nodes}</div>`;
}

  return `<span class="prov"><i style="background:${m[1]}">${m[0]}</i>${p[0].toUpperCase() + p.slice(1)}</span>`;
}

/* --- Feedback tab --- */

  const typeTag = { bug: ['Bug', 'type-bug'], ux: ['UX', 'type-ux'], feat: ['Feature', 'type-feat'], quality: ['Quality', 'type-quality'] };
  const prio = p => p === 'high' ? '<span class="prio" style="color:var(--red)">▲</span>' : p === 'med' ? '<span class="prio" style="color:var(--amber)">■</span>' : '<span class="prio" style="color:var(--faint)">▼</span>';
  const approved = state.proposals.filter(p => p === 'approved').length;
  return `
  <div class="report">
    <div class="report-head">
      <div class="agent-badge">${ic('sparkle', 18)}</div>
      <div style="flex:1">
        <div style="font-weight:600">Daily improvement report</div>
        <div class="small muted">${ic('calendar', 12)} Nov 11, 2026 · by Self-Improvement Agent · from 31 feedback items (9 valid, 22 filtered as noise/duplicates)</div>
      </div>
      <button class="btn sm ghost">Previous reports ${ic('chev', 14)}</button>
    </div>
    <div class="report-summary">
      Users love the generated copy but are blocked by <b>image quality</b> (label clipping, timeouts on large photos) and lack of <b>partial regeneration</b>.
      Success rate dropped 1.9pt this week, mostly from the Designer step. I recommend the 4 changes below — they’ll be built in Development and need your review before going to Production.
    </div>
    ${PROPOSALS.map((p, i) => {
      const s = state.proposals[i];
      return `
      <div class="proposal ${s}">
        <div class="num">${i + 1}</div>
        <div>
          <h4>${p.title}</h4>
          <p>${p.body}</p>
          <div class="refs">
            <span class="pill">Impact: ${p.impact}</span><span class="pill">Effort: ${p.effort}</span><span class="pill">Changes: ${p.affects}</span>
            ${p.refs.map(r => `<span class="ticket-ref" data-ref="${r}">${r}</span>`).join('')}
          </div>
        </div>
        <div class="proposal-actions">
          ${s === 'pending' ? `
            <button class="btn sm" data-reject="${i}">Reject</button>
            <button class="btn sm primary" data-approve="${i}">${ic('check', 14)} Approve</button>`
          : s === 'approved' ? `<span class="pill green">${ic('check', 12)} Approved · building in Dev</span><button class="btn sm ghost" data-undo="${i}">Undo</button>`
          : `<span class="pill">Rejected</span><button class="btn sm ghost" data-undo="${i}">Undo</button>`}
        </div>
      </div>`;
    }).join('')}
    <div class="report-foot">
      <span class="small muted">${approved} of ${PROPOSALS.length} approved</span>
      <span class="spacer"></span>
      <button class="btn sm">Ask agent about this report</button>
      <button class="btn sm accent" id="approveAll">${ic('check', 14)} Approve all</button>
    </div>
  </div>

  <div class="section-head">
    <h2>Feedback tickets</h2>
    <div style="display:flex;gap:8px">
      <label class="search" style="min-width:200px">${ic('search', 14)}<input placeholder="Search tickets" /></label>
      <button class="btn sm">${ic('filter', 14)} Type</button>
      <button class="btn sm">Sources: In-app, Email, Chat</button>
    </div>
  </div>
  <div class="board">
    ${cols.map(([k, l, c]) => {
      const list = TICKETS.filter(t => t.col === k);
      return `
      <div class="col">
        <div class="col-head"><span class="pill ${c === 'violet' ? '' : c}" style="${c === 'violet' ? 'background:#f1eafe;color:var(--violet)' : ''}"><span class="dot"></span>${l}</span><span class="n">${list.length}</span></div>
        ${list.map(t => `
          <div class="ticket ${state.highlight && state.highlight.includes(t.key) ? 'hl' : ''}" id="t-${t.key}">
            <div style="display:flex;gap:6px;align-items:center"><span class="mono">${t.key}</span><span class="type-tag ${typeTag[t.type][1]}">${typeTag[t.type][0]}</span><span style="flex:1"></span>${prio(t.prio)}</div>
            <div class="title">${t.title}</div>
            <div class="quote">${t.quote}</div>
            <div class="foot"><span>▲ ${t.votes}</span><span>· ${t.src}</span><span class="spacer"></span><span>${t.user}</span></div>
          </div>`).join('')}
      </div>`;
    }).join('')}
  </div>`;
}

/* --- Agent chat panel --- */
function chatPanel(app, tab) {
  const ctx = { screen: 'Screen · Key benefits section', monitoring: 'Monitoring · Designer node', users: 'Users', feedback: 'Feedback · Daily report' }[tab];
  let msgs;
  if (app.isNew && state.pendingPrompt) {
    msgs = `
      <div class="msg user">${state.pendingPrompt.replace(/</g, '&lt;')}</div>
      <div class="msg agent">
        <div class="who"><span class="agent-badge" style="width:18px;height:18px;border-radius:5px"></span> Builder</div>
        <div>Got it. I’ll set this up as a small team of agents and a simple UI. Here’s the plan:</div>
        <div class="step done">${ic('check', 14)} Planner → Writer → Reviewer</div>
        <div class="step"><span class="spinner"></span> Generating first screen…</div>
      </div>`;
  } else if (tab === 'feedback') {
    msgs = `
      <div class="msg agent">
        <div class="who"><span class="agent-badge" style="width:18px;height:18px;border-radius:5px"></span> Self-Improvement Agent</div>
        <div>Today’s report is ready. 9 of 31 feedback items were actionable. The biggest win is <b>#1 smart-crop guard</b> — it addresses the top bug and part of the Designer error rate.</div>
        <div>Approve the proposals you agree with and I’ll implement them in <b>Development</b>. Nothing ships to Production until you publish.</div>
      </div>`;
  } else {
    msgs = `
      <div class="msg user">Make the benefits section shorter and add icons</div>
      <div class="msg agent">
        <div class="who"><span class="agent-badge" style="width:18px;height:18px;border-radius:5px"></span> Builder</div>
        <div class="step done">${ic('check', 14)} Read screen: Key benefits</div>
        <div class="step done">${ic('check', 14)} Updated writer target length (3 → 2 lines)</div>
        <div class="step done">${ic('check', 14)} Added icon slot to section</div>
        <div>Done — the change is in <b>Development</b>. Review it in the preview, then publish when ready.</div>
      </div>`;
  }
  return `
  <aside class="chat">
    <div class="chat-head">
      <b>Agent</b><span class="pill">${app.name}</span><span class="spacer"></span>
      <button class="btn sm ghost">${ic('plus', 14)}</button>
      <button class="btn sm ghost">${ic('dots', 14)}</button>
    </div>
    <div class="chat-sub">${ic('lock', 12)} Only you can see this conversation</div>
    <div class="msgs">${msgs}</div>
    <div class="composer">
      <span class="context-chip">${ic('monitor', 12)} ${ctx}</span>
      <textarea placeholder="Ask for a change… use @ to target an agent"></textarea>
      <div class="composer-row">
        <button class="btn sm ghost">${ic('plus', 14)}</button>
        <span class="model">Auto ${ic('chev', 12)}</span>
        <span class="spacer"></span>
        <button class="send" style="width:30px;height:30px">${ic('up', 14)}</button>
      </div>
    </div>
  </aside>`;
}

function bindApp(r) {
  document.querySelectorAll('[data-dev]').forEach(b => b.onclick = () => { state.device = b.dataset.dev; render(); });
  document.querySelectorAll('[data-node]').forEach(b => b.onclick = () => { state.selectedNode = b.dataset.node; render(); });
  document.querySelectorAll('[data-uf]').forEach(b => b.onclick = () => { state.userFilter = b.dataset.uf; render(); });
  document.querySelectorAll('[data-user]').forEach(b => b.onclick = () => { state.drawerUser = +b.dataset.user; render(); });
  const cd = document.getElementById('closeDrawer'); if (cd) cd.onclick = () => { state.drawerUser = null; render(); };
  document.getElementById('toggleChat').onclick = () => { state.chatOpen = !state.chatOpen; render(); };
  document.getElementById('deployBtn').onclick = () => toast('Deployed to production · keley.app/' + ME.handle + '/' + r.id);
  const ab = document.getElementById('applyBtn'); if (ab) ab.onclick = () => toast('Published to production');
  document.querySelectorAll('[data-approve]').forEach(b => b.onclick = () => { state.proposals[+b.dataset.approve] = 'approved'; toast('Approved — agent is implementing it in Development'); render(); });
  document.querySelectorAll('[data-reject]').forEach(b => b.onclick = () => { state.proposals[+b.dataset.reject] = 'rejected'; render(); });
  document.querySelectorAll('[data-undo]').forEach(b => b.onclick = () => { state.proposals[+b.dataset.undo] = 'pending'; render(); });
  const aa = document.getElementById('approveAll'); if (aa) aa.onclick = () => { state.proposals = state.proposals.map(p => p === 'pending' ? 'approved' : p); toast('All proposals approved'); render(); };
  document.querySelectorAll('[data-ref]').forEach(b => b.onclick = () => {
    const prop = PROPOSALS.find(p => p.refs.includes(b.dataset.ref));
    state.highlight = prop ? prop.refs : [b.dataset.ref];
    render();
    document.getElementById('t-' + b.dataset.ref)?.scrollIntoView({ behavior: 'smooth', block: 'center' });
  });
}

/* ============ Render ============ */
function render() {
  const r = parse();
  const root = document.getElementById('app');
  if (r.name !== 'app') { state.drawerUser = null; }
  if (r.name === 'home') { root.innerHTML = viewHome(); bindHome(); }
  else if (r.name === 'apps') { root.innerHTML = viewApps(); bindApps(); }
  else { root.innerHTML = viewApp(r); bindApp(r); }

  const cur = r.name === 'app' ? r.tab : r.name;
  const links = [['home', '#/', '1 Home'], ['apps', '#/apps', '2 My Apps'], ['screen', '#/app/detail-page/screen', '3 Screen'], ['monitoring', '#/app/detail-page/monitoring', 'Monitoring'], ['users', '#/app/detail-page/users', 'Users'], ['feedback', '#/app/detail-page/feedback', 'Feedback']];
  document.getElementById('proto').innerHTML = '<span>Screens</span>' + links.map(([k, h, l]) => `<a href="${h}" class="${cur === k ? 'on' : ''}">${l}</a>`).join('');
}
render();
</script>
